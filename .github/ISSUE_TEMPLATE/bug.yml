name: ხარვეზი / Bug
description: მოდი არ ჩაიტვირთა, თამაში გაითიშა ან რაღაც არ მუშაობს / The mod doesn't load, the game crashes, or something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: რა მოხდა? / What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: როგორ გავიმეოროთ? / How to make it happen again?
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: თამაშის ვერსია და სისტემა / Game version and system
      placeholder: "მაგ. 1.2, Windows 11 / e.g. 1.2, Windows 11"
  - type: textarea
    id: mods
    attributes:
      label: სხვა ჩართული მოდები / Other active mods
  - type: textarea
    id: screenshot
    attributes:
      label: ეკრანის სურათი ან ლოგი / Screenshot or log
