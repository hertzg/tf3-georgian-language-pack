<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2b3b48"/>
      <stop offset="0.55" stop-color="#1a2630"/>
      <stop offset="1" stop-color="#0b1219"/>
    </radialGradient>
    <!-- Flag of Georgia, 30x20 units -->
    <g id="flag">
      <path fill="#fff" d="m0 0h30v20H0z"/>
      <g fill="#f00">
        <path d="m13 0h4v20h-4zM0 8h30v4H0z"/>
        <g id="c">
          <g id="b">
            <path id="a" d="m5.7968 1.954a5.4 5.4 0 0 0 1.4064 0 10.4 10.4 0 0 0 0 4.092 5.4 5.4 0 0 0-1.4064 0 10.4 10.4 0 0 0 0-4.092z"/>
            <use transform="rotate(90,6.5,4)" xlink:href="#a"/>
          </g>
          <use x="17" xlink:href="#b"/>
        </g>
        <use y="12" xlink:href="#c"/>
      </g>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- title: flag + ქართული ენის პაკეტი -->
  <rect x="267" y="152" width="270" height="180" fill="#222"/>
  <use xlink:href="#flag" transform="translate(255 140) scale(9)"/>
  <g font-family=".SF Georgian" font-weight="800" font-size="96">
    <text x="587" y="274" fill="#222">ქართული ენის პაკეტი</text>
    <text x="581" y="268" fill="#ffffff">ქართული ენის პაკეტი</text>
  </g>

  <text x="960" y="420" text-anchor="middle" font-family="Helvetica Neue" font-weight="700" font-size="46" letter-spacing="10" fill="#8fa3b3">GEORGIAN LANGUAGE PACK</text>

  <!-- menus: the game's main menu in Georgian -->
  <g transform="translate(80 500)">
    <rect x="12" y="12" width="400" height="260" rx="26" fill="#222"/>
    <rect width="400" height="260" rx="26" fill="#0f171e" stroke="#3a4d5c" stroke-width="3"/>
    <g font-family=".SF Georgian" font-weight="600" font-size="30" fill="#c9d6e0">
      <text x="36" y="52">გაგრძელება</text>
      <rect x="18" y="66" width="364" height="42" rx="8" fill="#3f62da"/>
      <text x="36" y="96" fill="#ffffff">ახალი თამაში</text>
      <text x="36" y="140">თამაშის ჩატვირთვა</text>
      <text x="36" y="184">პარამეტრები</text>
      <text x="36" y="228" fill="#8fa3b3">მოდები</text>
    </g>
  </g>

  <!-- town: Georgian town-entry sign (GE 5.23.1): white, black border, Georgian over Latin -->
  <g transform="translate(533 500)">
    <rect x="12" y="12" width="400" height="260" rx="26" fill="#222"/>
    <rect width="400" height="260" rx="26" fill="#ffffff" stroke="#111" stroke-width="3"/>
    <rect x="13" y="13" width="374" height="234" rx="16" fill="none" stroke="#111" stroke-width="8"/>
    <text x="200" y="128" text-anchor="middle" font-family=".SF Georgian" font-weight="600" font-size="68" fill="#111">სიღნაღი</text>
    <text x="200" y="204" text-anchor="middle" font-family="DIN Alternate" font-weight="700" font-size="52" letter-spacing="2" fill="#111">SIGHNAGHI</text>
  </g>

  <!-- street: Tbilisi street plate: blue, name + "გამზ.", English below, house number -->
  <g transform="translate(986 500)">
    <rect x="12" y="12" width="400" height="260" rx="26" fill="#222"/>
    <rect width="400" height="260" rx="26" fill="#3f62da"/>
    <text x="26" y="66" font-family=".SF Georgian" font-weight="700" font-size="36" fill="#ffffff">რუსთაველის გამზ.</text>
    <text x="28" y="106" font-family="Helvetica Neue" font-size="28" fill="#ffffff">Rustaveli Ave</text>
    <text x="376" y="196" text-anchor="end" font-family="Helvetica Neue" font-weight="700" font-size="110" fill="#ffffff">12</text>
    <text x="26" y="236" font-family=".SF Georgian" font-weight="700" font-size="26" fill="#ffffff">მთაწმინდა</text>
  </g>

  <!-- person: name card -->
  <g transform="translate(1439 500)">
    <rect x="12" y="12" width="400" height="260" rx="26" fill="#222"/>
    <rect width="400" height="260" rx="26" fill="#ffffff"/>
    <circle cx="86" cy="104" r="38" fill="#1a2630"/>
    <path d="M20 210 a66 62 0 0 1 132 0 z" fill="#1a2630"/>
    <text x="166" y="122" font-family=".SF Georgian" font-weight="700" font-size="38" fill="#1a2630">ილია</text>
    <text x="166" y="186" font-family=".SF Georgian" font-weight="700" font-size="38" fill="#1a2630">ჭავჭავაძე</text>
  </g>

  <!-- captions -->
  <g font-family="Helvetica Neue" font-weight="700" font-size="40" letter-spacing="8" text-anchor="middle" fill="#ffffff">
    <text x="280" y="860">MENUS</text>
    <text x="733" y="860">TOWNS</text>
    <text x="1186" y="860">STREETS</text>
    <text x="1639" y="860">PEOPLE</text>
  </g>

  <!-- source link: GitHub mark + repo URL -->
  <g transform="translate(550 944) scale(2.5)" fill="#8fa3b3">
    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
  </g>
  <text x="608" y="977" font-family="Helvetica Neue" font-size="36" fill="#8fa3b3">github.com/hertzg/tf3-georgian-language-pack</text>

  <!-- author credit -->
  <text x="1872" y="1040" text-anchor="end" font-family="Helvetica Neue" font-size="30" fill="#ffffff" fill-opacity="0.18">@hertzg</text>
</svg>
